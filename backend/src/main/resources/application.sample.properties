############################################
# SERVER CONFIG
############################################
server.port=8080


############################################
# DATABASE CONFIG (MySQL)
############################################
spring.datasource.url=jdbc:mysql://localhost:3306/YOUR_DB_NAME?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_DB_NAME
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


############################################
# JPA / HIBERNATE CONFIG
############################################
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect


############################################
# SPRING SECURITY (disable default login)
############################################
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Allow our custom security config to handle authentication
spring.main.allow-circular-references=true


############################################
# FILE UPLOAD (Invoice Images)
############################################
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB




############################################
# LOGGING
############################################
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
